<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory of the Rift – Dogma Arcade</title>
<script src="lang.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#0a0b14;color:#e6e6e6;font-family:'Cinzel',serif;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#120a1a,#0a0b14);}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:linear-gradient(to right,#0f111f,#14162a);border-bottom:1px solid rgba(122,93,187,.3);}
.back-btn{background:transparent;border:1px solid #333;color:#666;padding:7px 16px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;transition:.2s;}
.back-btn:hover{border-color:#c8a75d;color:#c8a75d;}
.coin-info{color:#ffd700;font-size:14px;letter-spacing:2px;}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:30px;}
.game-title{font-family:'Cinzel Decorative',serif;font-size:34px;color:#7a5dbb;letter-spacing:5px;text-shadow:0 0 30px rgba(122,93,187,.4);}
.game-sub{font-size:11px;color:#444;letter-spacing:4px;}
.hud{display:flex;gap:48px;font-size:14px;letter-spacing:2px;}
.hud-time{color:#ff4d4d;}.hud-pairs{color:#7a5dbb;}.hud-moves{color:#555;}
#grid{display:grid;grid-template-columns:repeat(7,110px);gap:10px;}
.card{width:110px;height:110px;background:linear-gradient(145deg,#181a30,#101222);border:2px solid #2a2e50;
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.3s;position:relative;overflow:hidden;}
.card:hover:not(.flipped):not(.matched){border-color:#7a5dbb;box-shadow:0 0 14px rgba(122,93,187,.3);transform:translateY(-2px);}
.card.flipped,.card.matched{background:linear-gradient(145deg,#1a1530,#100e22);border-color:#7a5dbb;}
.card.matched{border-color:#5dbb8a;opacity:.65;}
.card-back{font-size:28px;color:#2a2e50;font-weight:700;}
.card-img{width:88px;height:88px;object-fit:contain;mix-blend-mode:screen;display:none;}
.card-name{position:absolute;bottom:4px;font-size:8px;color:#555;letter-spacing:1px;display:none;}
.card.flipped .card-img,.card.matched .card-img{display:block;}
.card.flipped .card-name,.card.matched .card-name{display:block;color:#7a5dbb;}
.card.flipped .card-back,.card.matched .card-back{display:none;}
.rules-box{background:rgba(122,93,187,.07);border:1px solid rgba(122,93,187,.25);padding:22px 40px;max-width:560px;text-align:left;}
.rules-box p{font-size:12px;color:#888;line-height:1.9;letter-spacing:1px;}
.start-btn{background:#7a5dbb;border:none;color:#fff;padding:14px 56px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:.2s;}
.start-btn:hover{box-shadow:0 0 24px rgba(122,93,187,.5);}
.start-btn:disabled{opacity:.4;cursor:default;}
.result-title{font-family:'Cinzel Decorative',serif;font-size:30px;color:#7a5dbb;margin-bottom:8px;}
.result-coins{font-size:52px;color:#ffd700;margin:14px 0;}
.result-sub{font-size:12px;color:#666;letter-spacing:2px;margin-bottom:28px;}
.result-btns{display:flex;gap:14px;}
.btn-again{background:#7a5dbb;border:none;color:#fff;padding:12px 36px;font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;}
.btn-back{background:transparent;border:1px solid #444;color:#777;padding:12px 28px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:2px;cursor:pointer;}
.btn-back:hover{border-color:#c8a75d;color:#c8a75d;}
</style>
</head>
<body>
<div class="header">
    <div id="langSelectorWrap" style="position:relative;"></div>
    <button class="back-btn" onclick="location.href='arcade.html'"><span data-i18n="back_arcade">← ARCADE</span></button>
    <div style="font-family:'Cinzel Decorative',serif;font-size:16px;color:#7a5dbb;letter-spacing:3px;">MEMORY OF THE RIFT</div>
    <div class="coin-info">🪙 <span id="coinCount">···</span></div>
</div>
<div class="game-area">
    <div id="startScreen" style="display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;">
        <div class="game-title" data-i18n="memory_title">MEMORY OF THE RIFT</div>
        <div class="game-sub" data-i18n="memory_sub">MATCH EVERY MONSTER BEFORE TIME RUNS OUT</div>
        <div class="rules-box">
            <p>🃏 14 cards — 7 monster pairs from the Rift</p>
            <p>⏱ 90 seconds to find all pairs</p>
            <p>🏆 Under 30s: 15 coins &nbsp;|&nbsp; Under 60s: 10 coins &nbsp;|&nbsp; Finish: 6 coins</p>
            <p>🪙 Cost: 3 Coins per round</p>
        </div>
        <button class="start-btn" id="startBtn" onclick="startGame()">PLAY — 3 COINS</button>
    </div>
    <div id="gameScreen" style="display:none;flex-direction:column;align-items:center;gap:22px;">
        <div class="hud">
            <span class="hud-time">⏱ <span id="timer">90</span>s</span>
            <span class="hud-pairs">🃏 <span id="pairsLeft">7</span> pairs left</span>
            <span class="hud-moves">Moves: <span id="moves">0</span></span>
        </div>
        <div id="grid"></div>
    </div>
    <div id="resultScreen" style="display:none;flex-direction:column;align-items:center;text-align:center;">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-coins" id="resultCoins"></div>
        <div class="result-sub" id="resultSub"></div>
        <div class="result-btns">
            <button class="btn-again" onclick="resetGame()"><span data-i18n="play_again">PLAY AGAIN</span></button>
            <button class="btn-back" onclick="location.href='arcade.html'"><span data-i18n="back_arcade">← ARCADE</span></button>
        </div>
    </div>
</div>
<script>
const MONSTERS=[{"id": "goblin", "name": "Goblin", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Goblin01.png"}, {"id": "saurian", "name": "Saurian", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Saurian01.png"}, {"id": "warg", "name": "Warg", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Warg01.png"}, {"id": "chimera", "name": "Chimera", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Chimera01.png"}, {"id": "evil_eye", "name": "Evil Eye", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/EvilEye01.png"}, {"id": "golem", "name": "Geo Golem", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Golem01.png"}, {"id": "hydra", "name": "Hydra", "img": "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Hydra01.png"}];
const COST=3,TIME=90;
let flipped=[],matched=0,moves=0,timeLeft=TIME,timer=null,canFlip=true,startTime=0,myCoins=0;

async function loadCoins(){
    try{const r=await fetch('https://api.ddon.org/api/festival/coins',{credentials:'include'});
    if(r.ok){const d=await r.json();myCoins=d.coins||0;document.getElementById('coinCount').textContent=myCoins;}}catch(_){}
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildGrid(){
    const pairs=shuffle([...MONSTERS,...MONSTERS]);
    const grid=document.getElementById('grid');grid.innerHTML='';
    pairs.forEach((m,i)=>{
        const card=document.createElement('div');
        card.className='card';card.dataset.id=m.id;card.dataset.idx=i;card.dataset.revealed='0';
        card.innerHTML='<div class="card-back">?</div><img class="card-img" src="'+m.img+'" alt="'+m.name+'"><div class="card-name">'+m.name+'</div>';
        card.onclick=()=>flipCard(card);
        grid.appendChild(card);
    });
}

async function startGame(){
    if(myCoins<COST){alert('Not enough coins!');return;}
    const btn=document.getElementById('startBtn');btn.disabled=true;btn.textContent='···';
    try{
        const r=await fetch('https://api.ddon.org/api/festival/arcade/bet',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:COST})});
        const d=await r.json();
        if(!d.success){alert('Not enough coins!');btn.disabled=false;btn.textContent='PLAY — 3 COINS';return;}
        myCoins=d.coinsLeft;document.getElementById('coinCount').textContent=myCoins;
    }catch(_){btn.disabled=false;btn.textContent='PLAY — 3 COINS';return;}
    flipped=[];matched=0;moves=0;timeLeft=TIME;canFlip=true;startTime=Date.now();
    document.getElementById('startScreen').style.display='none';
    document.getElementById('gameScreen').style.display='flex';
    document.getElementById('pairsLeft').textContent=MONSTERS.length;
    document.getElementById('moves').textContent=0;
    document.getElementById('timer').textContent=TIME;
    buildGrid();
    timer=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0)endGame(false);},1000);
}

function flipCard(card){
    if(!canFlip||card.dataset.revealed==='1'||flipped.length>=2)return;
    card.dataset.revealed='1';card.classList.add('flipped');flipped.push(card);
    if(flipped.length===2){
        moves++;document.getElementById('moves').textContent=moves;canFlip=false;
        const [a,b]=flipped;
        if(a.dataset.id===b.dataset.id){
            a.classList.add('matched');b.classList.add('matched');matched++;flipped=[];canFlip=true;
            document.getElementById('pairsLeft').textContent=MONSTERS.length-matched;
            if(matched===MONSTERS.length)setTimeout(()=>endGame(true),400);
        }else{
            setTimeout(()=>{[a,b].forEach(c=>{c.dataset.revealed='0';c.classList.remove('flipped');});flipped=[];canFlip=true;},900);
        }
    }
}

async function endGame(success){
    clearInterval(timer);
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    let reward=0;
    if(success){reward=elapsed<30?15:elapsed<60?10:6;}
    const title=success?(elapsed<30?'LIGHTNING FAST!':elapsed<60?'WELL DONE!':'COMPLETED!'):"TIME'S UP!";
    const sub=success?'Completed in '+elapsed+'s · '+moves+' moves':'Better luck next time!';
    if(reward>0){
        try{const r=await fetch('https://api.ddon.org/api/festival/arcade/payout',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:reward,game:'memory',meta:{elapsed,won:success}})});const d=await r.json();if(d.success){myCoins=d.coinsLeft;document.getElementById('coinCount').textContent=myCoins;showAchPopups(d.newAchievements);}}catch(_){}
    }
    document.getElementById('gameScreen').style.display='none';
    document.getElementById('resultScreen').style.display='flex';
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultCoins').textContent=(reward>0?'+':'')+reward+' 🪙';
    document.getElementById('resultSub').textContent=sub;
}

function resetGame(){
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('startScreen').style.display='flex';
    document.getElementById('startBtn').disabled=false;
    document.getElementById('startBtn').textContent='PLAY — 3 COINS';
}


const ACH_NAMES={goblin_first:'Goblin Smasher',goblin_10:'Whack Master',goblin_20:'Goblin Destroyer',
memory_first:'Sharp Mind',memory_fast:'Rift Scholar',roulette_first:'Duelist',roulette_streak:'Unstoppable Arisen',
board_first:'Rolling Start',board_jackpot:"Fortune's Favorite",board_item:'Rift Collector',
arcade_all:'Festival Champion',first_coin:'Coin Collector',coins_100:'Festival Regular',
coins_500:'Festival Veteran',coins_1000:'Festival Legend'};
const ACH_ICONS={goblin_first:'🪓',goblin_10:'💥',goblin_20:'👺',memory_first:'🃏',memory_fast:'⚡',
roulette_first:'⚔️',roulette_streak:'🔥',board_first:'🎲',board_jackpot:'⭐',board_item:'🎁',
arcade_all:'🎮',first_coin:'🪙',coins_100:'💰',coins_500:'💎',coins_1000:'👑'};

function showAchPopups(ids){
    (ids||[]).forEach((id,i)=>{
        setTimeout(()=>{
            const el=document.createElement('div');
            el.className='ach-notif';
            el.innerHTML='<div class="ach-notif-icon">'+(ACH_ICONS[id]||'🏆')+'</div><div class="ach-notif-eye">ACHIEVEMENT UNLOCKED</div><div class="ach-notif-name">'+(ACH_NAMES[id]||id)+'</div>';
            document.getElementById('achNotifContainer').appendChild(el);
            el.addEventListener('animationend',()=>el.remove());
        },i*600);
    });
}

loadCoins();

// Language selector init
if(window.buildLangSelector){
    document.getElementById('langSelectorWrap').innerHTML=window.buildLangSelector();
}
window.addEventListener('langchange',()=>{ location.reload(); });

</script>

<style>
#achNotifContainer{position:fixed;top:80px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.ach-notif{background:linear-gradient(135deg,#181a30,#101222);border:1px solid #c8a75d;padding:12px 18px;min-width:240px;animation:achSlide 4s ease forwards;}
@keyframes achSlide{0%{opacity:0;transform:translateX(40px);}10%{opacity:1;transform:translateX(0);}80%{opacity:1;}100%{opacity:0;}}
.ach-notif-eye{font-size:9px;letter-spacing:3px;color:#c8a75d;opacity:.6;margin-bottom:4px;}
.ach-notif-name{font-size:13px;color:#fff;letter-spacing:1px;}
.ach-notif-icon{font-size:20px;margin-bottom:4px;}
</style>
<div id="achNotifContainer"></div>

</body>
</html>
