<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory of the Rift – Dogma Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#0a0b14;color:#e6e6e6;font-family:'Cinzel',serif;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(10,11,20,.95);border-bottom:1px solid #2a2d48;}
.back-btn{background:transparent;border:1px solid #333;color:#666;padding:6px 14px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;}
.back-btn:hover{border-color:#c8a75d;color:#c8a75d;}
.coin-info{color:#ffd700;font-size:14px;letter-spacing:2px;}
.game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.game-title{font-family:'Cinzel Decorative',serif;font-size:30px;color:#7a5dbb;letter-spacing:4px;}
.hud{display:flex;gap:40px;font-size:15px;letter-spacing:2px;}
.hud-time{color:#ff4d4d;}.hud-pairs{color:#7a5dbb;}.hud-moves{color:#888;}
#grid{display:grid;grid-template-columns:repeat(6,90px);gap:10px;}
.card{width:90px;height:90px;background:linear-gradient(145deg,#181a30,#101222);border:2px solid #2a2e50;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;transition:.3s;position:relative;transform-style:preserve-3d;}
.card:hover:not(.flipped):not(.matched){border-color:#7a5dbb;transform:scale(1.05);}
.card.flipped,.card.matched{background:linear-gradient(145deg,#1a1530,#100e22);border-color:#7a5dbb;}
.card.matched{border-color:#5dbb8a;opacity:.7;cursor:default;}
.card.shake{animation:cardShake .3s ease;}
@keyframes cardShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
#startScreen,#resultScreen{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;}
.rules{background:rgba(255,255,255,.04);border:1px solid #2a2e50;padding:20px 32px;max-width:440px;text-align:left;}
.rules p{font-size:12px;color:#888;line-height:1.8;letter-spacing:1px;}
.start-btn{background:#7a5dbb;border:none;color:#fff;padding:13px 48px;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;}
.start-btn:disabled{opacity:.4;cursor:default;}
.result-title{font-family:'Cinzel Decorative',serif;font-size:28px;}
.result-coins{font-size:44px;color:#ffd700;}
.result-btns{display:flex;gap:14px;}
.btn-again{background:#7a5dbb;border:none;color:#fff;padding:11px 30px;font-family:'Cinzel',serif;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;}
.btn-back{background:transparent;border:1px solid #444;color:#888;padding:11px 24px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer;}
.btn-back:hover{border-color:#c8a75d;color:#c8a75d;}
</style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="location.href='arcade.html'">← ARCADE</button>
    <div style="font-family:'Cinzel Decorative',serif;font-size:16px;color:#7a5dbb;letter-spacing:3px;">🃏 MEMORY OF THE RIFT</div>
    <div class="coin-info">🪙 <span id="coinCount">···</span></div>
</div>
<div class="game-area">
    <div id="startScreen">
        <div class="game-title">MEMORY OF THE RIFT</div>
        <div style="font-size:12px;color:#555;letter-spacing:3px;">MATCH ALL PAIRS BEFORE TIME RUNS OUT</div>
        <div class="rules">
            <p>🃏 18 cards (9 pairs) of DDON monsters</p>
            <p>⏱ 90 seconds to find all pairs</p>
            <p>⚡ Faster completion = more coins</p>
            <p>🪙 Cost: 3 Coins</p>
            <p>🏆 &lt;30s = 15 coins · &lt;60s = 10 coins · finish = 6 coins</p>
        </div>
        <button class="start-btn" id="startBtn" onclick="startGame()">PLAY — 3 COINS</button>
    </div>

    <div id="gameScreen" style="display:none;flex-direction:column;align-items:center;gap:20px;">
        <div class="hud">
            <span class="hud-time">⏱ <span id="timer">90</span>s</span>
            <span class="hud-pairs">🃏 <span id="pairsLeft">9</span> pairs left</span>
            <span class="hud-moves">Moves: <span id="moves">0</span></span>
        </div>
        <div id="grid"></div>
    </div>

    <div id="resultScreen" style="display:none;">
        <div class="result-title" id="resultTitle">·</div>
        <div class="result-coins" id="resultCoins">·</div>
        <div style="font-size:12px;color:#888;letter-spacing:2px;" id="resultSub">·</div>
        <div class="result-btns">
            <button class="btn-again" onclick="resetGame()">PLAY AGAIN</button>
            <button class="btn-back" onclick="location.href='arcade.html'">← ARCADE</button>
        </div>
    </div>
</div>

<script>
const MONSTERS=['👺','👹','🦁','👁️','🐍','🪨','🐺','🧌','⚡'];
const COST=3, TIME=90;
let flipped=[], matched=0, moves=0, timeLeft=TIME, timer=null, canFlip=true, startTime=0;
let myCoins=0;

async function loadCoins(){
    try{const r=await fetch('https://api.ddon.org/api/festival/coins',{credentials:'include'});if(r.ok){const d=await r.json();myCoins=d.coins||0;document.getElementById('coinCount').textContent=myCoins;}}catch(_){}
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

function buildGrid(){
    const cards=shuffle([...MONSTERS,...MONSTERS]);
    const grid=document.getElementById('grid'); grid.innerHTML='';
    cards.forEach((m,i)=>{
        const card=document.createElement('div');
        card.className='card';card.dataset.value=m;card.dataset.idx=i;
        card.dataset.revealed='0';
        card.textContent='?'; card.style.fontSize='28px'; card.style.color='#2a2e50';
        card.onclick=()=>flipCard(card);
        grid.appendChild(card);
    });
}

async function startGame(){
    if(myCoins<COST){alert('Not enough coins!');return;}
    const btn=document.getElementById('startBtn'); btn.disabled=true;
    try{
        const r=await fetch('https://api.ddon.org/api/festival/arcade/bet',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:COST})});
        const d=await r.json();
        if(!d.success){alert('Not enough coins!');btn.disabled=false;return;}
        myCoins=d.coinsLeft; document.getElementById('coinCount').textContent=myCoins;
    }catch(_){btn.disabled=false;return;}

    flipped=[];matched=0;moves=0;timeLeft=TIME;canFlip=true;startTime=Date.now();
    document.getElementById('startScreen').style.display='none';
    document.getElementById('gameScreen').style.display='flex';
    document.getElementById('pairsLeft').textContent=MONSTERS.length;
    document.getElementById('moves').textContent=0;
    document.getElementById('timer').textContent=TIME;
    buildGrid();
    timer=setInterval(()=>{
        timeLeft--;document.getElementById('timer').textContent=timeLeft;
        if(timeLeft<=0) endGame(false);
    },1000);
}

function flipCard(card){
    if(!canFlip||card.dataset.revealed==='1'||flipped.length>=2) return;
    card.dataset.revealed='1';
    card.textContent=card.dataset.value;card.style.fontSize='42px';card.style.color='#fff';
    card.classList.add('flipped');
    flipped.push(card);
    if(flipped.length===2){
        moves++;document.getElementById('moves').textContent=moves;
        canFlip=false;
        const [a,b]=flipped;
        if(a.dataset.value===b.dataset.value){
            a.classList.add('matched');b.classList.add('matched');
            matched++;flipped=[];canFlip=true;
            document.getElementById('pairsLeft').textContent=MONSTERS.length-matched;
            if(matched===MONSTERS.length) setTimeout(()=>endGame(true),400);
        } else {
            setTimeout(()=>{
                [a,b].forEach(c=>{c.dataset.revealed='0';c.textContent='?';c.style.fontSize='28px';c.style.color='#2a2e50';c.classList.remove('flipped');c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),300);});
                flipped=[];canFlip=true;
            },900);
        }
    }
}

async function endGame(success){
    clearInterval(timer);
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    let reward=0;
    if(success){ reward=elapsed<30?15:elapsed<60?10:6; }
    const title=success?(elapsed<30?'LIGHTNING FAST!':elapsed<60?'WELL DONE!':'COMPLETED!'):'TIME\'S UP!';
    const sub=success?`Completed in ${elapsed}s with ${moves} moves`:'Better luck next time!';

    if(reward>0){
        try{
            const r=await fetch('https://api.ddon.org/api/festival/arcade/payout',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:reward,game:'memory'})});
            const d=await r.json();if(d.success){myCoins=d.coinsLeft;document.getElementById('coinCount').textContent=myCoins;}
        }catch(_){}
    }
    document.getElementById('gameScreen').style.display='none';
    document.getElementById('resultScreen').style.display='flex';
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultCoins').textContent=(reward>0?'+':'')+reward+' 🪙';
    document.getElementById('resultSub').textContent=sub;
}

function resetGame(){
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('startScreen').style.display='flex';
    document.getElementById('startBtn').disabled=false;
}

loadCoins();
</script>
</body>
</html>
