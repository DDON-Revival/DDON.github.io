<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Boss – Dogma Festival III</title>

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self' https:;
script-src 'self' 'unsafe-inline' https:;
style-src 'self' 'unsafe-inline' https:;
connect-src 'self' https: wss://api.ddon.org;
img-src 'self' https: data:;
">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0a0c16;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at top, #2a0e0e 0%, #0a0c16 55%);
    transition: background 1s;
}

#bg.rage {
    background: radial-gradient(ellipse at top, #4a0a0a 0%, #0a0c16 55%);
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    color: #ff4d4d;
    font-size: 58px;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    letter-spacing: 4px;
}

#bossName {
    font-size: 26px;
    margin-bottom: 18px;
    color: #ffcccc;
    letter-spacing: 2px;
}

/* ── Boss container ──────────────────────────── */
#bossContainer {
    position: relative;
    width: 620px;
    height: 400px;
    margin-bottom: 24px;
    cursor: crosshair;
    user-select: none;
}

#boss {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: float 3.2s infinite ease-in-out;
    user-select: none;
    pointer-events: none;
    transform-origin: center center;
}

/* red flash overlay */
#hitOverlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 8px;
    mix-blend-mode: screen;
}

#hitOverlay.flash {
    animation: redFlash 0.35s ease forwards;
}

@keyframes redFlash {
    0%   { background: rgba(255,30,0,0); }
    25%  { background: rgba(255,30,0,0.55); }
    100% { background: rgba(255,30,0,0); }
}

/* ── Animations ──────────────────────────────── */
@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-14px); }
}

@keyframes hitShake {
    0%   { transform: translateX(0) translateY(-7px); }
    15%  { transform: translateX(-16px) translateY(-7px); }
    35%  { transform: translateX(16px) translateY(-7px); }
    55%  { transform: translateX(-9px) translateY(-7px); }
    75%  { transform: translateX(9px) translateY(-7px); }
    100% { transform: translateX(0) translateY(-7px); }
}

@keyframes deathCrumble {
    0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 1; filter: brightness(1); }
    20%  { transform: translateY(6px) rotate(-3deg) scale(1.02); opacity: 0.9; filter: brightness(2.5) saturate(0.5); }
    50%  { transform: translateY(20px) rotate(-8deg) scale(0.95); opacity: 0.6; filter: brightness(0.5) saturate(0); }
    100% { transform: translateY(70px) rotate(-14deg) scale(0.85); opacity: 0;   filter: brightness(0) saturate(0); }
}

#boss.shaking {
    animation: hitShake 0.38s ease !important;
}

#boss.dead {
    animation: deathCrumble 2.2s ease forwards !important;
}

/* ── Slash hit mark ──────────────────────────── */
.slash {
    position: absolute;
    pointer-events: none;
    width: 54px;
    height: 54px;
    animation: slashAnim 0.5s ease-out forwards;
    z-index: 10;
}

.slash::before,
.slash::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 3px;
    background: #ff4d4d;
    top: 50%;
    left: 0;
    box-shadow: 0 0 8px #ff2200, 0 0 18px rgba(255,50,0,0.6);
    border-radius: 2px;
}

.slash::before { transform: rotate(45deg); }
.slash::after  { transform: rotate(-45deg); }

@keyframes slashAnim {
    0%   { opacity: 1; transform: scale(0.4) rotate(-10deg); }
    40%  { opacity: 1; transform: scale(1.15) rotate(-10deg); }
    100% { opacity: 0; transform: scale(1.4) rotate(-10deg) translateY(-18px); }
}

/* ── Floating damage numbers ─────────────────── */
.dmgPop {
    position: absolute;
    color: #ffe082;
    font-size: 40px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 6px rgba(255,150,0,0.5);
    animation: dmgFloat 1s ease-out forwards;
    z-index: 20;
    white-space: nowrap;
}

@keyframes dmgFloat {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    25%  { opacity: 1; transform: translateY(-28px) scale(1.25); }
    100% { opacity: 0; transform: translateY(-90px) scale(0.85); }
}

/* ── HP bar ──────────────────────────────────── */
.hpBar {
    width: 700px;
    height: 40px;
    background: #141414;
    border: 2px solid #ff4d4d;
    overflow: hidden;
    margin-bottom: 10px;
    position: relative;
}

.hpFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #cc1010, #ff6a10);
    transition: width 0.3s ease;
    position: relative;
}

/* HP bar sheen */
.hpFill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 60%);
}

#hpText {
    font-size: 24px;
    margin-bottom: 16px;
    letter-spacing: 1px;
    color: #ffdddd;
}

/* ── Click hint ──────────────────────────────── */
#clickHint {
    font-size: 13px;
    color: rgba(255, 180, 180, 0.45);
    margin-top: -6px;
    margin-bottom: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: hintPulse 2.2s ease-in-out infinite;
}

@keyframes hintPulse {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.75; }
}

/* ── Leaderboard ─────────────────────────────── */
#leaderboard {
    position: fixed;
    right: 30px;
    top: 30px;
    width: 300px;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 77, 77, 0.5);
    padding: 18px 20px;
    backdrop-filter: blur(4px);
}

#leaderboard h2 {
    margin-top: 0;
    margin-bottom: 10px;
    color: #ff4d4d;
    font-size: 18px;
    letter-spacing: 3px;
}

.playerRow {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 15px;
    color: #ffcccc;
}

.playerRow:first-child {
    color: #ffd700;
    font-weight: bold;
}

/* ── Online counter ──────────────────────────── */
#online {
    position: fixed;
    left: 30px;
    top: 30px;
    font-size: 22px;
    color: rgba(255, 200, 200, 0.7);
    letter-spacing: 2px;
}

/* ── Screen shake ────────────────────────────── */
@keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    20%       { transform: translate(-6px, 3px); }
    40%       { transform: translate(6px, -3px); }
    60%       { transform: translate(-4px, 2px); }
    80%       { transform: translate(4px, -2px); }
}

.container.screenShake {
    animation: screenShake 0.35s ease !important;
}
</style>
</head>

<body>

<div id="bg"></div>
<div style="position:fixed;top:20px;left:20px;z-index:100;">
    <button onclick="location.href='festival.html'" style="
        background:transparent;
        border:1px solid #555;
        color:#888;
        padding:8px 16px;
        font-family:Arial,sans-serif;
        font-size:12px;
        letter-spacing:2px;
        cursor:pointer;
        transition:.2s;
    "
    onmouseover="this.style.borderColor='#ff4d4d';this.style.color='#ff4d4d';"
    onmouseout="this.style.borderColor='#555';this.style.color='#888';">
        ← FESTIVAL
    </button>
</div>


<div id="online">ONLINE: 0</div>

<div id="leaderboard">
    <h2>TOP DAMAGE</h2>
    <div id="topPlayers"></div>
</div>

<div class="container" id="mainContainer">

    <h1>WORLD BOSS</h1>
    <div id="bossName">The Abyssal Hydra</div>

    <div id="bossContainer" onclick="onBossClick(event)">
        <!--
            Bild-Pfad anpassen:
            https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/hydra01.png
        -->
        <img id="boss"
             src="https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/Hydra01.png"
             alt="Abyssal Hydra Boss">
        <div id="hitOverlay"></div>
    </div>

    <div id="clickHint">⚔ Click the Hydra to attack ⚔</div>

    <div class="hpBar">
        <div class="hpFill" id="hpFill"></div>
    </div>

    <div id="hpText">10,000,000 / 10,000,000 HP</div>

</div>

<script>

// ─────────────────────────────────────────────────────────────
// Web Audio – synthesized sounds
// ─────────────────────────────────────────────────────────────
let audioCtx = null;

function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playHitSound() {
    try {
        const ctx = getCtx();
        const t   = ctx.currentTime;

        // Thud (pitch drop)
        const osc     = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.18);
        oscGain.gain.setValueAtTime(0.38, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.22);

        // Noise burst (impact crunch)
        const bufLen = Math.floor(ctx.sampleRate * 0.14);
        const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const data   = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
        const noise  = ctx.createBufferSource();
        noise.buffer = buf;
        const ng     = ctx.createGain();
        ng.gain.setValueAtTime(0.45, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        noise.connect(ng);
        ng.connect(ctx.destination);
        noise.start(t);
    } catch(e) { console.warn('Audio error:', e); }
}

function playRoarSound() {
    try {
        const ctx    = getCtx();
        const t      = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.55, t);
        master.connect(ctx.destination);

        // Three layered oscillators – low serpentine roar
        const layers = [
            { freq: 55, type: 'sawtooth', vol: 0.18 },
            { freq: 88, type: 'sine',     vol: 0.10 },
            { freq: 42, type: 'square',   vol: 0.07 },
        ];

        layers.forEach(({ freq, type, vol }) => {
            const osc = ctx.createOscillator();
            const g   = ctx.createGain();
            osc.type  = type;
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.linearRampToValueAtTime(freq * 1.35, t + 0.5);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.65, t + 1.6);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(vol, t + 0.25);
            g.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
            osc.connect(g);
            g.connect(master);
            osc.start(t);
            osc.stop(t + 2.0);
        });

        // Noise rumble
        const bLen = Math.floor(ctx.sampleRate * 1.5);
        const bBuf = ctx.createBuffer(1, bLen, ctx.sampleRate);
        const bd   = bBuf.getChannelData(0);
        for (let i = 0; i < bLen; i++) bd[i] = (Math.random() * 2 - 1) * 0.5;
        const ns  = ctx.createBufferSource();
        ns.buffer = bBuf;
        const nlp = ctx.createBiquadFilter();
        nlp.type  = 'lowpass';
        nlp.frequency.value = 200;
        const ng  = ctx.createGain();
        ng.gain.setValueAtTime(0, t);
        ng.gain.linearRampToValueAtTime(0.12, t + 0.4);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
        ns.connect(nlp);
        nlp.connect(ng);
        ng.connect(master);
        ns.start(t);
    } catch(e) { console.warn('Audio error:', e); }
}

function playDeathSound() {
    try {
        const ctx    = getCtx();
        const t      = ctx.currentTime;
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.7, t);
        master.connect(ctx.destination);

        // Dramatic descending tones
        [140, 95, 62].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g   = ctx.createGain();
            osc.type  = 'sawtooth';
            osc.frequency.setValueAtTime(freq * 1.8, t + i * 0.1);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.25, t + 2.8);
            g.gain.setValueAtTime(0.22 - i * 0.04, t + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
            osc.connect(g);
            g.connect(master);
            osc.start(t + i * 0.1);
            osc.stop(t + 2.8);
        });

        // Final crash noise
        const bLen = Math.floor(ctx.sampleRate * 1.2);
        const bBuf = ctx.createBuffer(1, bLen, ctx.sampleRate);
        const bd   = bBuf.getChannelData(0);
        for (let i = 0; i < bLen; i++) bd[i] = (Math.random() * 2 - 1) * (1 - i / bLen);
        const ns  = ctx.createBufferSource();
        ns.buffer = bBuf;
        const ng  = ctx.createGain();
        ng.gain.setValueAtTime(0.32, t + 1.4);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
        ns.connect(ng);
        ng.connect(master);
        ns.start(t + 1.4);
    } catch(e) { console.warn('Audio error:', e); }
}

// ─────────────────────────────────────────────────────────────
// State & DOM refs
// ─────────────────────────────────────────────────────────────
let bossHp         = 10000000;
let maxHp          = 10000000;
let attackCooldown = false;
let playerName    = null;
let isDead         = false;
let lastClickX     = 200;
let lastClickY     = 200;

const hpFill        = document.getElementById('hpFill');
const hpText        = document.getElementById('hpText');
const bossEl        = document.getElementById('boss');
const bossBox       = document.getElementById('bossContainer');
const hitOverlay    = document.getElementById('hitOverlay');
const topPlayers    = document.getElementById('topPlayers');
const mainContainer = document.getElementById('mainContainer');
const bg            = document.getElementById('bg');

// ─────────────────────────────────────────────────────────────
// WebSocket
// ─────────────────────────────────────────────────────────────
const ws = new WebSocket('wss://api.ddon.org/ws');

ws.onopen = () => {
    console.log('WS CONNECTED');
    ws.send(JSON.stringify({ type: 'worldBossConnect' }));
};

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'bossState') {
        bossHp = data.hp;
        maxHp  = data.maxHp;
        updateBossBar();
    }

    if (data.type === 'bossHit') {
        bossHp = data.hp;
        updateBossBar();
        triggerHit(data.damage);
        checkRageMode();
    }

    if (data.type === 'leaderboard') {
        renderLeaderboard(data.players);
    }

    if (data.type === 'online') {
        document.getElementById('online').innerText = 'ONLINE: ' + data.count;
    }

    if (data.type === 'bossDead') {
        triggerDeath();
    }
};

// ─────────────────────────────────────────────────────────────
// Click-to-attack
// ─────────────────────────────────────────────────────────────
function onBossClick(e) {
    if (isDead || attackCooldown) return;
    attackCooldown = true;
    setTimeout(() => { attackCooldown = false; }, 300);

    lastClickX = e.offsetX;
    lastClickY = e.offsetY;

    spawnSlash(e.offsetX, e.offsetY);

    ws.send(JSON.stringify({
        type: 'attackBoss',
        name: playerName
    }));
}

// ─────────────────────────────────────────────────────────────
// Visual effects
// ─────────────────────────────────────────────────────────────
function triggerHit(dmg) {
    // Shake boss
    bossEl.classList.remove('shaking');
    void bossEl.offsetWidth;
    bossEl.classList.add('shaking');
    bossEl.addEventListener('animationend', () => bossEl.classList.remove('shaking'), { once: true });

    // Red flash overlay
    hitOverlay.classList.remove('flash');
    void hitOverlay.offsetWidth;
    hitOverlay.classList.add('flash');
    hitOverlay.addEventListener('animationend', () => hitOverlay.classList.remove('flash'), { once: true });

    // Screen micro-shake
    mainContainer.classList.remove('screenShake');
    void mainContainer.offsetWidth;
    mainContainer.classList.add('screenShake');
    mainContainer.addEventListener('animationend', () => mainContainer.classList.remove('screenShake'), { once: true });

    // Damage popup
    spawnDmgNumber(dmg);

    // Sound
    playHitSound();
}

function triggerDeath() {
    if (isDead) return;
    isDead = true;

    document.getElementById('bossName').innerText = '☠  DEFEATED  ☠';
    document.getElementById('clickHint').innerText = '— The Abyssal Hydra has fallen —';
    document.getElementById('clickHint').style.color = 'rgba(255,200,200,0.5)';

    bossEl.classList.remove('shaking');
    bossEl.classList.add('dead');

    playDeathSound();
}

function spawnSlash(x, y) {
    const el = document.createElement('div');
    el.className = 'slash';
    el.style.left = (x - 27) + 'px';
    el.style.top  = (y - 27) + 'px';
    bossBox.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

function spawnDmgNumber(dmg) {
    const el = document.createElement('div');
    el.className = 'dmgPop';
    el.innerText = '-' + Number(dmg).toLocaleString();
    const rx = lastClickX + (Math.random() * 50 - 25);
    const ry = lastClickY - 30;
    el.style.left = rx + 'px';
    el.style.top  = ry + 'px';
    bossBox.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

function updateBossBar() {
    const pct = Math.max(0, (bossHp / maxHp) * 100);
    hpFill.style.width = pct + '%';
    hpText.innerText   = Number(bossHp).toLocaleString()
        + ' / ' + Number(maxHp).toLocaleString() + ' HP';
}

function renderLeaderboard(players) {
    topPlayers.innerHTML = '';
    players.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'playerRow';
        // eigenen Spieler gold highlighten
        if (playerName && p.name === playerName) {
            row.style.color  = '#ffd700';
            row.style.fontWeight = 'bold';
        }
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
        row.innerHTML = `<span>${medal} ${p.name}</span><span>${Number(p.damage).toLocaleString()}</span>`;
        topPlayers.appendChild(row);
    });
}

function checkRageMode() {
    const pct = bossHp / maxHp;
    if (pct <= 0.25) {
        bg.classList.add('rage');
    } else {
        bg.classList.remove('rage');
    }
}

// ─────────────────────────────────────────────────────────────
// Periodic Hydra roar (every 12–22 seconds)
// ─────────────────────────────────────────────────────────────
function scheduleRoar() {
    const delay = 12000 + Math.random() * 10000;
    setTimeout(() => {
        if (!isDead) playRoarSound();
        scheduleRoar();
    }, delay);
}
scheduleRoar();


// ─────────────────────────────────────────────────────────────
// Player name – Login integration
// ─────────────────────────────────────────────────────────────
async function resolvePlayerName() {
    // ① Festival-Name aus der Hub-Page (sessionStorage)
    const fromHub = sessionStorage.getItem('festivalName');
    if (fromHub) return fromHub;

    // ② Festival-Profil vom Server
    try {
        const res = await fetch('https://api.ddon.org/api/festival/me', {
            credentials: 'include'
        });
        if (res.ok) {
            const d = await res.json();
            if (d.exists && d.username) return d.username;
        }
    } catch (_) {}

    // ③ Account-Name Fallback
    try {
        const res = await fetch('https://api.ddon.org/api/me', {
            credentials: 'include'
        });
        if (res.ok) {
            const d = await res.json();
            if (d.name) return d.name;
        }
    } catch (_) {}

    // ④ Letzter Fallback
    let uid = sessionStorage.getItem('_bossUid');
    if (!uid) {
        uid = 'Arisen_' + Math.random().toString(36).slice(2, 6).toUpperCase();
        sessionStorage.setItem('_bossUid', uid);
    }
    return uid;
}

// Init
(async () => {
    playerName = await resolvePlayerName();
    // Eigenen Namen in der Leaderboard-Zeile highlighten
    document.querySelectorAll('.playerRow').forEach(r => {
        if (r.textContent.includes(playerName)) r.style.color = '#ffd700';
    });
})();

</script>
</body>
</html>
