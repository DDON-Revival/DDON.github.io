<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dogma Festival - World Boss</title>

<meta http-equiv="Content-Security-Policy"
content="
default-src 'self' https:;
script-src 'self' 'unsafe-inline' https:;
style-src 'self' 'unsafe-inline' https:;
connect-src 'self' https: wss://api.ddon.org;
img-src 'self' https: data:;
">

<style>

body{
    margin:0;
    background:#0b0d18;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top,#301515 0%,#0b0d18 60%);
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    color:#ff4d4d;
    font-size:58px;
    margin-bottom:10px;
    text-shadow:0 0 20px rgba(255,0,0,0.6);
}

#bossName{
    font-size:28px;
    margin-bottom:20px;
}

#bossContainer{
    position:relative;
    width:420px;
    height:420px;
    margin-bottom:30px;
}

#boss{
    width:100%;
    animation:float 3s infinite ease-in-out;
    user-select:none;
    pointer-events:none;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0px);
    }
}

.hpBar{
    width:700px;
    height:42px;
    background:#1b1b1b;
    border:2px solid #ff4d4d;
    overflow:hidden;
    margin-bottom:10px;
}

.hpFill{
    height:100%;
    width:100%;
    background:
    linear-gradient(
        90deg,
        #ff1f1f,
        #ff7a1f
    );
    transition:0.25s;
}

#hpText{
    font-size:26px;
    margin-bottom:25px;
}

#attackBtn{
    background:#ff4d4d;
    border:none;
    color:white;
    font-size:28px;
    padding:18px 60px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

#attackBtn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(255,0,0,0.6);
}

#damageText{
    position:absolute;
    color:#ffe082;
    font-size:42px;
    font-weight:bold;
    pointer-events:none;
    opacity:0;
}

#leaderboard{
    position:fixed;
    right:30px;
    top:30px;
    width:320px;
    background:rgba(0,0,0,0.5);
    border:1px solid #ff4d4d;
    padding:20px;
}

#leaderboard h2{
    margin-top:0;
    color:#ff4d4d;
}

.playerRow{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

#online{
    position:fixed;
    left:30px;
    top:30px;
    font-size:24px;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="online">
ONLINE: 0
</div>

<div id="leaderboard">

<h2>
TOP DAMAGE
</h2>

<div id="topPlayers"></div>

</div>

<div class="container">

<h1>
WORLD BOSS
</h1>

<div id="bossName">
The Infernal Rift Dragon
</div>

<div id="bossContainer">

<img id="boss"
src="https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/boss.png">

<div id="damageText">
+0
</div>

</div>

<div class="hpBar">

<div class="hpFill" id="hpFill"></div>

</div>

<div id="hpText">
10,000,000 / 10,000,000 HP
</div>

<button id="attackBtn" onclick="attackBoss()">
ATTACK
</button>

</div>

<script>

const ws =
new WebSocket(
    "wss://api.ddon.org/ws"
);

let bossHp = 10000000;
let maxHp = 10000000;

let attackCooldown = false;

const hpFill =
document.getElementById(
    "hpFill"
);

const hpText =
document.getElementById(
    "hpText"
);

const damageText =
document.getElementById(
    "damageText"
);

const topPlayers =
document.getElementById(
    "topPlayers"
);

ws.onopen = ()=>{

    console.log("WS CONNECTED");

    ws.send(JSON.stringify({

        type:"worldBossConnect"

    }));
};

ws.onmessage = (event)=>{

    const data =
    JSON.parse(event.data);

    if(data.type === "bossState"){

        bossHp = data.hp;
        maxHp = data.maxHp;

        updateBossBar();
    }

    if(data.type === "bossHit"){

        bossHp = data.hp;

        updateBossBar();

        showDamage(
            data.damage
        );
    }

    if(data.type === "leaderboard"){

        renderLeaderboard(
            data.players
        );
    }

    if(data.type === "online"){

        document.getElementById(
            "online"
        ).innerText =
        "ONLINE: " + data.count;
    }

    if(data.type === "bossDead"){

        document.getElementById(
            "bossName"
        ).innerText =
        "BOSS SLAIN";
    }
};

function attackBoss(){

    if(attackCooldown)
        return;

    attackCooldown = true;

    setTimeout(()=>{

        attackCooldown = false;

    },300);

    ws.send(JSON.stringify({

        type:"attackBoss",

        name:
        localStorage.getItem(
            "accountName"
        ) || "Player"

    }));
}

function updateBossBar(){

    const percent =
    (bossHp/maxHp)*100;

    hpFill.style.width =
    percent + "%";

    hpText.innerText =
    bossHp.toLocaleString()
    +
    " / "
    +
    maxHp.toLocaleString()
    +
    " HP";
}

function showDamage(dmg){

    damageText.innerText =
    "-" + dmg;

    damageText.style.opacity = 1;

    damageText.style.top = "120px";

    setTimeout(()=>{

        damageText.style.opacity = 0;

    },500);
}

function renderLeaderboard(players){

    topPlayers.innerHTML = "";

    players.forEach((p,i)=>{

        topPlayers.innerHTML += `
        
        <div class="playerRow">

            <span>
                ${i+1}. ${p.name}
            </span>

            <span>
                ${p.damage.toLocaleString()}
            </span>

        </div>
        `;
    });
}

</script>

</body>
</html>
