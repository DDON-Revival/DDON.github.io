<style>
body{
    margin:0;
    background:radial-gradient(circle at top,#121425 0%,#0a0b14 60%);
    color:#e6e6e6;
    font-family:'Cinzel', serif;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:25px 80px;
    background:linear-gradient(to right,#0f111f,#14162a);
    border-bottom:1px solid #2a2d48;
}

.header h1{
    margin:0;
    font-size:30px;
    color:#c8a75d;
    letter-spacing:3px;
}

/* LANGUAGE */

#languageSelector{
    display:flex;
    gap:8px;
}

.langBtn{
    background:transparent;
    border:1px solid #c8a75d;
    color:#c8a75d;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
    transition:0.25s;
}

.langBtn:hover{
    background:#c8a75d;
    color:black;
}

/* LAYOUT */

.container{
    display:flex;
    padding:60px 100px;
    gap:60px;
}

/* SIDEBAR */

.sidebar{
    width:240px;
    background:#111320;
    padding:25px;
    border:1px solid #252845;
}

.sidebar button{
    width:100%;
    margin-bottom:20px;
}

/* MAIN */

.main{
    flex:1;
}

/* CARDS */

.card{
    background:linear-gradient(145deg,#181a30,#101222);
    padding:35px;
    border:1px solid #2a2e50;
    box-shadow:0 0 40px rgba(0,0,0,0.8);
    margin-bottom:40px;
}

.card h2{
    margin-top:0;
    color:#c8a75d;
    border-bottom:1px solid #2a2e50;
    padding-bottom:10px;
}

/* CHARACTER GRID */

.charactersGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:30px;
}

#loginSection input{
    display: block;
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    background: #0f1020;
    border: 1px solid #2a2e50;
    color: white;
    box-sizing: border-box;
}

/* CHARACTER CARD */

.characterCard{
    background:#131528;
    border:1px solid #2a2d48;
    padding:25px;
    transition:0.3s;
}

.characterCard:hover{
    transform:translateY(-6px);
    box-shadow:0 0 20px rgba(200,167,93,0.35);
    border-color:#c8a75d;
}

.characterCard h3{
    margin:0;
    margin-bottom:10px;
    color:#ffffff;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    margin-top:12px;
    border:1px solid #c8a75d;
    color:#c8a75d;
    font-size:12px;
}

/* BUTTON */

button{
    background:#c8a75d;
    border:none;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.25s;
}

button:hover{
    box-shadow:0 0 10px rgba(200,167,93,0.6);
}

/* MODAL */

#passwordModal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:400px;
    background:#181a30;
    border:1px solid #c8a75d;
    padding:30px;
    z-index:1000;
}

#resetModal{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:400px;
    background:#181a30;
    border:1px solid #c8a75d;
    padding:30px;
    z-index:1001;   /* WICHTIG: höher als overlay */
}

#passwordModal input{
    width:100%;
    padding:8px;
    margin-bottom:15px;
    background:#0f1020;
    border:1px solid #2a2e50;
    color:white;
}

#modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);
    z-index:999;
}

#itemList{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:10px;
    margin-top:15px;
}

.itemRow{
    display:flex;
    align-items:center;
    gap:10px;
    background:#11142a;
    border:1px solid #2a2e50;
    padding:8px 12px;
    transition:0.2s;
}

.blockedItem{
    border-color:#c8a75d;
    background:#1b1f3b;
}

.blockedItem .itemName{
    color:#ffd97a;
    font-weight:bold;
}

.itemRow:hover{
    border-color:#c8a75d;
    box-shadow:0 0 6px rgba(200,167,93,0.4);
}

.itemName{
    flex:1;
}

.itemId{
    color:#777;
    font-size:12px;
}

</style>
</head>

<script>

const bgMusic = new Audio(
    "assets/sounds/music.mp3"
);

bgMusic.loop = true;
bgMusic.volume = 0.35;

const jobMap = {
    1: "Fighter",
    2: "Seeker",
    3: "Hunter",
    4: "Priest",
    5: "Shield Sage",
    6: "Sorcerer",
    7: "Warrior",
    8: "Element Archer",
    9: "Alchemist",
    10: "Spirit Lancer",
    11: "High Scepter"
};

async function login(event){

    if(event) event.preventDefault();

    const loginMsg = document.getElementById("loginMsg");

    const lang = localStorage.getItem("lang") || "en";
    const t = translations[lang];

    loginMsg.style.color = "#ff6b6b";

    try{
const res = await fetch("https://api.ddon.org/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    credentials: "include", // 🔥 WICHTIG
body:JSON.stringify({
    username: document.getElementById("username").value.trim(),
    password: document.getElementById("password").value
})
});

        const data = await res.json();
		console.log("LOGIN RESPONSE:", data);

        if(res.status !== 200){
            const lang = localStorage.getItem("lang") || "en";
const t = translations[lang];

loginMsg.textContent = t[data.error] || data.error || t.loginFailed;
            return;
        }


        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboardContainer").style.display = "flex";

        loadCharacters();
		loadEmail();

}catch(e){
    loginMsg.textContent = t.connectionError;
}

}

async function register(){

    const lang = localStorage.getItem("lang") || "en";
    const t = translations[lang];
    const loginMsg = document.getElementById("loginMsg");

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const email = document.getElementById("email").value.trim();

    loginMsg.style.color = "#ff6b6b";

    if(!username || !password || !email){
        loginMsg.textContent = "Please fill all fields";
        return;
    }

    if(!email.includes("@")){
        loginMsg.textContent = "Invalid email";
        return;
    }

    try{

        const res = await fetch("https://api.ddon.org/api/register",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                username,
                password,
                email
            })
        });

const data = await res.json();

// ❗ WICHTIG: Error im BODY prüfen
if(data.Error){
    loginMsg.style.color = "#ff6b6b";
    loginMsg.textContent =
        t[data.Error] ||
        data.Error ||
        "Register failed";
    return;
}

// ✅ SUCCESS
loginMsg.style.color = "#4caf50";
loginMsg.textContent = data.Message || "Account created!";

        // 🔥 NICE UX
        document.getElementById("password").value = "";

        // optional: auto login
        // await login();

    }catch(e){
        loginMsg.textContent = "Connection error";
    }
}

async function loadCharacters(){

    const lang = localStorage.getItem("lang") || "en";
    const t = translations[lang];
    const container = document.getElementById("characters");

    try{
        const res = await fetch("https://api.ddon.org/api/characters",{
    credentials: "include" // 🔥
});

        if(!res.ok){
            container.innerHTML = "";
            const p = document.createElement("p");
            p.textContent = t.charactersLoadError;
            container.appendChild(p);
            return;
        }

        const chars = await res.json();
        container.innerHTML = "";

        if(!chars.length){
            const p = document.createElement("p");
            p.textContent = t.noCharacters;
            container.appendChild(p);
            return;
        }

        chars.forEach(c => {

            const card = document.createElement("div");
            card.className = "characterCard";

            const name = document.createElement("h3");
            name.textContent = c.name; // SAFE
            card.appendChild(name);

            const jobContainer = document.createElement("div");

            c.jobs.forEach(j => {

                const badge = document.createElement("span");
                badge.className = "badge";

                const jobName = jobMap[j.job] || j.job;
                const translatedJob =
                    translations[lang]?.jobs?.[jobName] || jobName;

                badge.textContent = translatedJob + " Lv." + j.level; // SAFE
                jobContainer.appendChild(badge);
            });

            card.appendChild(jobContainer);
            container.appendChild(card);
        });

    }catch(e){
        container.innerHTML = "";
        const p = document.createElement("p");
        p.textContent = t.characterApiError;
        container.appendChild(p);
    }
}

async function loadEmail(){

    const lang = localStorage.getItem("lang") || "en";
    const t = translations[lang];

    const res = await fetch("https://api.ddon.org/api/me",{
        credentials: "include"
    });

    if(!res.ok) return;

    const data = await res.json();
    const status = document.getElementById("emailStatus");

    if(!data.mail){
        status.textContent = t.noEmailSet;
        status.style.color = "#ff6b6b";
    }
    else if(!data.mail_verified){
        status.textContent = t.emailNotVerified.replace("{email}", data.mail);
        status.style.color = "#ffa726";
    }
    else{
        status.textContent = t.emailVerified.replace("{email}", data.mail);
        status.style.color = "#4caf50";
    }
}

async function logout(){

    await fetch("https://api.ddon.org/api/logout",{
        method: "POST",
        credentials: "include"
    });

    location.reload();
}

function applyTranslations(){
    const lang = localStorage.getItem("lang") || "en";
    const t = translations[lang];

    document.querySelectorAll("[data-key]").forEach(el=>{
        const key = el.getAttribute("data-key");
        if(t[key]) el.textContent = t[key];
    });

    document.querySelectorAll("[data-placeholder]").forEach(el=>{
        const key = el.getAttribute("data-placeholder");
        if(t[key]) el.placeholder = t[key];
    });
}

/* PASSWORD */

function openChangePassword(){
    modalOverlay.style.display="block";
    passwordModal.style.display="block";
}

function closeChangePassword(){
    modalOverlay.style.display="none";
    passwordModal.style.display="none";
}

async function changePassword(){

    const pwMsg = document.getElementById("pwMsg");

    if(newPass.value !== confirmPass.value){

        const lang = localStorage.getItem("lang") || "en";
        const t = translations[lang];

        pwMsg.textContent = t.passwordsDontMatch;
        return;
    }

const res = await fetch("https://api.ddon.org/api/change-password",{
    method:"POST",
    headers:{
        "Content-Type":"application/json"
    },
    credentials: "include", // 🔥
    body:JSON.stringify({
        current:currentPass.value,
        new:newPass.value
    })
});

    const data = await res.json();
    const lang = localStorage.getItem("lang") || "en";
const t = translations[lang];

pwMsg.textContent =
    t[data.message] ||
    t[data.error] ||
    t.unknownError;
}

function initLanguageSelector(){

    const container = document.getElementById("languageSelector");
    container.innerHTML = "";

    const currentLang = localStorage.getItem("lang") || "en";

    window.languages.forEach(lang=>{
        const btn = document.createElement("button");
        btn.className = "langBtn";
        btn.innerText = lang.flag + " " + lang.code.toUpperCase();

        if(lang.code === currentLang){
            btn.style.background = "#c8a75d";
            btn.style.color = "black";
        }

        btn.onclick = ()=>{
            localStorage.setItem("lang", lang.code);
            location.reload();
        };

        container.appendChild(btn);
    });
}

let registerMode = false;

function showRegister(){

    const email = document.getElementById("email");

    if(!registerMode){
        email.style.display = "block";
        registerMode = true;

        // optional UX
        document.getElementById("loginMsg").textContent = "Enter email to register";
    } else {
        register();
    }
}

function showLogin(){
    document.getElementById("email").style.display = "none";
    registerMode = false;
}

async function openAutoLoot(){

    document.getElementById("autolootCard").style.display = "block";

    await loadItems();
    await loadBlocked();

}

function openFestival(){

    const card = document.getElementById("festivalCard");

    if(card.style.display === "none"){

        card.style.display = "block";

    }else{

        card.style.display = "none";
    }
}

function openFestivalPrototype(){

    document.getElementById("riftGameOverlay").style.display = "block";

    startRiftPrototype();
	
	bgMusic.play();
}

function closeRiftPrototype(){

bgMusic.pause();
bgMusic.currentTime = 0;

    document.getElementById("riftGameOverlay").style.display = "none";
}

function startRiftPrototype(){

    const canvas = document.getElementById("riftCanvas");
    const ctx = canvas.getContext("2d");

    const keys = {};
	const TILE_W = 96;
const TILE_H = 48;

const MAP_SIZE = 12;

const fighterImg = new Image();
fighterImg.src = "assets/player_fighter.png";

const hunterImg = new Image();
hunterImg.src = "assets/player_hunter.png";

const priestImg = new Image();
priestImg.src = "assets/player_priest.png";

const goblinImg = new Image();
goblinImg.src = "assets/goblin.png";

const bossImg = new Image();
bossImg.src = "assets/cyclops.png";

const riftImg = new Image();
riftImg.src = "assets/riftstone.png";

const slashSound = new Audio(
    "assets/sounds/slash.wav"
);

const hitSound = new Audio(
    "assets/sounds/hit.wav"
);
	
function isoToScreen(x,y){

    return {
        x: (x - y) * (TILE_W/2) + 640,
        y: (x + y) * (TILE_H/2) + 160
    };
}

let player = {
    x: 0,
    y: 0,
    size: 32,
    speed: 0.12,
    hp: 100,
    class: selectedClass
};

    let enemies = [];
	let damageTexts = [];
	let particles = [];

    let kills = 0;
	let wave = 1;
	let enemiesToSpawn = 5;
	let spawnedEnemies = 0;

    let attackCooldown = false;
	let attackFlash = 0;
	let walkAnim = 0;
	let screenShake = 0;
	let fighterFrame = 0;
let fighterAnimTick = 0;

    // controls
window.addEventListener("keydown",(e)=>{

    if(
        document.getElementById("riftGameOverlay").style.display !== "block"
    ){
        return;
    }

    e.preventDefault();

    keys[e.key.toLowerCase()] = true;

    if(e.key === "1"){
        player.class = "fighter";
    }

    if(e.key === "2"){
        player.class = "hunter";
    }

    if(e.key === "3"){
        player.class = "priest";
    }

    if(e.code === "Space" && !attackCooldown){

        attackCooldown = true;

        attack();

        setTimeout(()=>{
            attackCooldown = false;
        },250);
    }
});

window.addEventListener("keyup",(e)=>{

    if(
        document.getElementById("riftGameOverlay").style.display !== "block"
    ){
        return;
    }

    keys[e.key.toLowerCase()] = false;
});

    // spawn goblins
setInterval(()=>{

    if(document.getElementById("riftGameOverlay").style.display === "none")
        return;

    // wave complete
    if(spawnedEnemies >= enemiesToSpawn && enemies.length === 0){

        wave++;

        spawnedEnemies = 0;

        enemiesToSpawn += 3;
    }

    // stop spawning if wave limit reached
    if(spawnedEnemies >= enemiesToSpawn)
        return;

    spawnedEnemies++;

    const side = Math.floor(Math.random()*4);

    let x = 0;
    let y = 0;

if(side === 0){
    x = -12;
    y = Math.random()*12-6;
}

if(side === 1){
    x = 12;
    y = Math.random()*12-6;
}

if(side === 2){
    x = Math.random()*12-6;
    y = -12;
}

if(side === 3){
    x = Math.random()*12-6;
    y = 12;
}

const isBoss = wave % 5 === 0;

enemies.push({
    x,
    y,
    size: isBoss ? 180 : 84,
speed: isBoss
    ? 0.05
    : 0.035 + (wave*0.003),
    hp: isBoss
        ? 25 + (wave*2)
        : 2 + Math.floor(wave/2),
    boss: isBoss
});

},1000);

    function attack(){
slashSound.pause();
slashSound.currentTime = 0;

slashSound.play().catch(()=>{});
	attackFlash = 8;
	
	let attackRange = 1.8;

if(player.class === "hunter"){
    attackRange = 3.5;
}

if(player.class === "priest"){

    player.hp += 5;

    if(player.hp > 100)
        player.hp = 100;
}

        enemies = enemies.filter(enemy=>{

            const dx = enemy.x-player.x;
            const dy = enemy.y-player.y;

            const dist = Math.sqrt(dx*dx+dy*dy);
			
if(dist <= 0.001){
    return true;
}

            if(dist < attackRange){
			
			const crit =
    Math.random() < 0.18;

                enemy.hp -= crit ? 2 : 1;
hitSound.pause();
hitSound.currentTime = 0;

hitSound.play().catch(()=>{});
				screenShake = crit
    ? 14
    : (enemy.boss ? 14 : 5);
				
for(let i = 0; i < 8; i++){

    particles.push({

        x: enemy.x,
        y: enemy.y,

        vx: Math.random()*0.6-0.3,
        vy: Math.random()*0.6-0.3,

        life: 25,

        size: 2 + Math.random()*4
    });
}

damageTexts.push({

    x: enemy.x,
    y: enemy.y,

    text: crit ? "CRIT!" : "1",

    crit: crit,

    life: 40
});

                if(enemy.hp <= 0){

                    kills++;

                    return false;
                }
            }

async function loadItems(){

    const res = await fetch(
        "https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/datas/item_names.json"
    );

    const data = await res.json();

    allItems = data.item || [];

}

async function loadBlocked(){

    const res = await fetch("https://api.ddon.org/api/autoloot/list",{
        credentials:"include"
    });

    blockedItems = await res.json();

    renderItems();

}

function renderItems(){

const container = document.getElementById("itemList");
const search = document.getElementById("itemSearch").value.toLowerCase();
const counter = document.getElementById("blockedCounter");

container.innerHTML = "";

// counter
const lang = localStorage.getItem("lang") || "en";
const t = translations[lang];

counter.textContent = t.Autoloot.autolootBlocked + ": " + blockedItems.length;

// sort items (blocked first)
const sortedItems = [...allItems].sort((a,b)=>{

    const aBlocked = blockedItems.includes(a.id);
    const bBlocked = blockedItems.includes(b.id);

    if(aBlocked && !bBlocked) return -1;
    if(!aBlocked && bBlocked) return 1;

    return 0;
});

for(const item of sortedItems){

    const lang = localStorage.getItem("lang") || "en";

    const name = lang === "jp"
        ? item.old
        : item.new;

    if(!name) continue;

    if(search && !name.toLowerCase().includes(search))
        continue;

    const card = document.createElement("div");
    card.className = "itemRow";

    if(blockedItems.includes(item.id)){
        card.classList.add("blockedItem");
    }

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = blockedItems.includes(item.id);

    checkbox.onchange = ()=>toggleItem(item.id, checkbox.checked);

    const label = document.createElement("span");
    label.className = "itemName";
    label.textContent = name;

    const id = document.createElement("span");
    id.className = "itemId";
    id.textContent = "#"+item.id;

    card.appendChild(checkbox);
    card.appendChild(label);
    card.appendChild(id);

    container.appendChild(card);
}

}

async function toggleItem(id, block){

    const url = block
        ? "https://api.ddon.org/api/autoloot/block"
        : "https://api.ddon.org/api/autoloot/unblock";

    await fetch(url,{
        method:"POST",
        credentials:"include",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({itemId:id})
    });

    if(block){
        if(!blockedItems.includes(id))
            blockedItems.push(id);
    }else{
        blockedItems = blockedItems.filter(i=>i!==id);
    }

}

let multiplayerPlayers = [];

ws.onmessage = (event)=>{

    const data =
        JSON.parse(event.data);

    // game started
    if(data.type === "gameStarted"){

        closeLobby();

        openFestivalPrototype();
    }

    // room browser
    if(data.type === "roomList"){

        openRoomBrowser(data.rooms);
    }

    // room created
    if(data.type === "roomCreated"){

        currentLobby = {

            code: data.code
        };

        openLobbyScreen();
    }

    // room update
    if(data.type === "roomUpdate"){

        multiplayerPlayers =
            data.players;

        if(currentLobby){

            currentLobby.players =
                multiplayerPlayers;

            renderLobbyPlayers();
        }
    }

    // errors
    if(data.type === "error"){

        alert(data.message);
    }
};

function generateLobbyCode(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ123456789";

    let code = "";

    for(let i = 0; i < 4; i++){

        code +=
            chars[
                Math.floor(Math.random()*chars.length)
            ];
    }

    return code;
}
