<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arisen's Board – Dogma Arcade</title>
<script src="lang.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#0a0b14;color:#e6e6e6;font-family:'Cinzel',serif;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(10,11,20,.95);border-bottom:1px solid #2a2d48;}
.back-btn{background:transparent;border:1px solid #333;color:#666;padding:6px 14px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;}
.back-btn:hover{border-color:#c8a75d;color:#c8a75d;}
.coin-info{color:#ffd700;font-size:14px;letter-spacing:2px;}
.main{flex:1;display:flex;gap:40px;padding:30px 60px;align-items:flex-start;justify-content:center;}

/* Board */
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;}
.board-title{font-family:'Cinzel Decorative',serif;font-size:22px;color:#c8a75d;letter-spacing:3px;}
#board{display:grid;grid-template-columns:repeat(5,100px);grid-template-rows:repeat(4,90px);gap:8px;position:relative;}
.tile{width:100px;height:90px;border:2px solid #2a2e50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;letter-spacing:1px;text-align:center;transition:.3s;position:relative;}
.tile.empty{background:transparent;border:none;}
.tile.active{border-color:#c8a75d;box-shadow:0 0 16px rgba(200,167,93,.4);background:linear-gradient(145deg,#201f10,#181510);}
.tile.current{border-color:#ffd700;box-shadow:0 0 24px rgba(255,215,0,.5);background:linear-gradient(145deg,#252010,#1a1508);}
.tile-icon{font-size:28px;}
.tile-name{font-size:9px;color:#666;letter-spacing:1px;}
.tile-type-coin{background:linear-gradient(145deg,#181508,#100e04);border-color:#3a3010;}
.tile-type-item{background:linear-gradient(145deg,#081518,#040e10);border-color:#103038;}
.tile-type-boss{background:linear-gradient(145deg,#180808,#100404);border-color:#381010;}
.tile-type-curse{background:linear-gradient(145deg,#150815,#0e040e);border-color:#30103a;}
.tile-type-bonus{background:linear-gradient(145deg,#081808,#041004);border-color:#103010;}
.tile-type-start{background:linear-gradient(145deg,#181818,#101010);border-color:#383838;}
.tile-type-jackpot{background:linear-gradient(145deg,#181508,#100e04);border-color:#c8a75d;}

/* Arisen token */
.token{position:absolute;width:36px;height:36px;background:#c8a75d;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:10;box-shadow:0 0 12px rgba(200,167,93,.6);transition:all .5s ease;}

/* Side panel */
.panel{width:320px;display:flex;flex-direction:column;gap:20px;}
.panel-section{background:linear-gradient(145deg,#181a30,#101222);border:1px solid #2a2e50;padding:20px;}
.panel-title{font-size:11px;letter-spacing:3px;color:#c8a75d;margin-bottom:14px;}
.stat-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.stat-val{color:#fff;}
.roll-btn{width:100%;padding:14px;background:#c8a75d;border:none;color:#0a0b14;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:.2s;}
.roll-btn:hover:not(:disabled){box-shadow:0 0 20px rgba(200,167,93,.4);}
.roll-btn:disabled{opacity:.4;cursor:default;}
.dice-display{font-size:64px;text-align:center;padding:10px;min-height:90px;display:flex;align-items:center;justify-content:center;}
.dice-rolling{animation:diceRoll .6s ease;}
@keyframes diceRoll{0%,100%{transform:scale(1);}50%{transform:scale(1.3) rotate(15deg);}}
.log{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.log-entry{font-size:11px;padding:6px 10px;border-left:2px solid #2a2e50;color:#888;letter-spacing:1px;}
.log-entry.good{border-color:#5dbb8a;color:#5dbb8a;}
.log-entry.bad{border-color:#ff4d4d;color:#ff4d4d;}
.log-entry.item{border-color:#c8a75d;color:#c8a75d;}
.log-entry.jackpot{border-color:#ffd700;color:#ffd700;}

/* Char picker */
#charPickerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;}
.char-modal{background:linear-gradient(145deg,#181a30,#101222);border:1px solid #c8a75d;padding:32px 44px;min-width:320px;text-align:center;}
.char-modal-title{font-size:15px;color:#c8a75d;letter-spacing:3px;margin-bottom:20px;}
.char-pick-row{background:#0f1020;border:1px solid #2a2e50;padding:12px 20px;cursor:pointer;font-size:13px;color:#fff;letter-spacing:2px;margin-bottom:8px;text-align:left;transition:.2s;}
.char-pick-row:hover{border-color:#c8a75d;color:#c8a75d;}
</style>
</head>
<body>
<div class="header">
    <div id="langSelectorWrap" style="position:relative;"></div>
    <button class="back-btn" onclick="location.href='arcade.html'">← ARCADE</button>
    <div style="font-family:'Cinzel Decorative',serif;font-size:16px;color:#c8a75d;letter-spacing:3px;">🎲 ARISEN'S BOARD</div>
    <div class="coin-info">🪙 <span id="coinCount">···</span></div>
</div>

<div class="main">
    <div class="board-wrap">
        <div class="board-title" data-i18n="board_title">THE RIFT BOARD</div>
        <div id="board"></div>
    </div>
    <div class="panel">
        <div class="panel-section">
            <div class="panel-title" data-i18n="status">STATUS</div>
            <div class="stat-row"><span>Position</span><span class="stat-val" id="posVal">0 / 15</span></div>
            <div class="stat-row"><span>Round</span><span class="stat-val" id="roundVal">0</span></div>
            <div class="stat-val" style="font-size:13px;color:#888;letter-spacing:1px;margin-bottom:16px;" id="statusMsg">Roll the dice to begin your journey!</div>
            <div class="dice-display" id="diceDisplay">🎲</div>
            <button class="roll-btn" id="rollBtn" onclick="rollDice()"><span data-i18n="roll_cost_10">🎲 ROLL — 10 COINS</span></button>
        </div>
        <div class="panel-section">
            <div class="panel-title" data-i18n="journey_log">JOURNEY LOG</div>
            <div class="log" id="log"></div>
        </div>
    </div>
</div>

<!-- Char picker -->
<div id="charPickerModal">
    <div class="char-modal">
        <div class="char-modal-title">SELECT CHARACTER</div>
        <div class="char-modal-sub" style="font-size:11px;color:#555;letter-spacing:2px;margin-bottom:20px;">Item will be sent to Itempost</div>
        <div id="charPickerList"></div>
        <button onclick="document.getElementById('charPickerModal').style.display='none'" style="margin-top:12px;width:100%;background:transparent;border:1px solid #333;color:#666;padding:8px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;cursor:pointer;">CANCEL</button>
    </div>
</div>

<script>
const COST = 10;
const BASE_IMG = 'https://raw.githubusercontent.com/DDON-Revival/DDON.github.io/main/assets/';
const BOARD_TILES = [
    {type:'start',   icon:'🏁', name:'START'},
    {type:'coin',    icon:'🪙', name:'+8 Coins',   coins:8},
    {type:'item',    icon:'🎁', name:'Mystery Item', rarity:'common'},
    {type:'coin',    icon:'🪙', name:'+5 Coins',   coins:5},
    {type:'boss',    icon:'boss_goblin', name:'Boss! -10c', coins:-10},
    {type:'coin',    icon:'🪙', name:'+12 Coins',  coins:12},
    {type:'bonus',   icon:'🎲', name:'Extra Roll'},
    {type:'item',    icon:'🎁', name:'Rare Item', rarity:'rare'},
    {type:'curse',   icon:'💀', name:'Curse -5c',  coins:-5},
    {type:'coin',    icon:'🪙', name:'+6 Coins',   coins:6},
    {type:'jackpot', icon:'⭐', name:'JACKPOT!',   coins:30},
    {type:'item',    icon:'🎁', name:'Mystery Item', rarity:'common'},
    {type:'coin',    icon:'🪙', name:'+10 Coins',  coins:10},
    {type:'boss',    icon:'boss_warg', name:'Goblin! -8c', coins:-8},
    {type:'coin',    icon:'🪙', name:'+15 Coins',  coins:15},
    {type:'bonus',   icon:'🎲', name:'Extra Roll'},
];

// Item pool loaded from shop API
let ITEM_POOL = [];
async function loadItemPool(){
    try{
        const r = await fetch('https://api.ddon.org/api/festival/shop');
        if(r.ok) ITEM_POOL = await r.json();
    }catch(_){}
}
function randItem(){
    if(!ITEM_POOL.length) return {itemId:7858, nameEn:'Bronze Ore', nameJp:'', name:'Bronze Ore'};
    const item = ITEM_POOL[Math.floor(Math.random()*ITEM_POOL.length)];
    return {...item, name: item.nameEn};
}

let position=0, myCoins=0, rolling=false, myChars=[], selectedChar=null;
let pendingItem=null;

async function init(){
    await loadItemPool();
    await loadCoins();
    await loadChars();
    buildBoard();
    positionToken(0,false);
}

async function loadCoins(){
    try{const r=await fetch('https://api.ddon.org/api/festival/coins',{credentials:'include'});if(r.ok){const d=await r.json();myCoins=d.coins||0;document.getElementById('coinCount').textContent=myCoins;}}catch(_){}
}

async function loadChars(){
    try{const r=await fetch('https://api.ddon.org/api/characters',{credentials:'include'});if(r.ok){myChars=await r.json();if(myChars.length===1)selectedChar=myChars[0].id;}}catch(_){}
}

function buildBoard(){
    const board=document.getElementById('board');
    board.innerHTML='';
    // Layout: 16 tiles in a loop on a 5x4 grid (perimeter)
    const positions=[
        [0,0],[1,0],[2,0],[3,0],[4,0], // top row
        [4,1],[4,2],[4,3],             // right col
        [3,3],[2,3],[1,3],[0,3],       // bottom row
        [0,2],[0,1],                   // left col
        [1,1],[2,1]                    // inner bonus tiles
    ];
    // Fill 5x4 grid
    for(let row=0;row<4;row++){
        for(let col=0;col<5;col++){
            const posIdx=positions.findIndex(p=>p[0]===col&&p[1]===row);
            const div=document.createElement('div');
            if(posIdx===-1){
                div.className='tile empty';
            } else {
                const t=BOARD_TILES[posIdx];
                div.className=`tile tile-type-${t.type}`;
                div.id='tile'+posIdx;
                const iconHtml = t.icon.startsWith('boss_')
    ? '<img src="'+BASE_IMG+t.icon.replace('boss_','').charAt(0).toUpperCase()+t.icon.replace('boss_','').slice(1)+'01.png" style="width:50px;height:50px;object-fit:contain;mix-blend-mode:screen;" />'
    : '<div class="tile-icon">'+t.icon+'</div>';
div.innerHTML=iconHtml+'<div class="tile-name">'+t.name+'</div>';
            }
            board.appendChild(div);
        }
    }
    // Add token container
    const token=document.createElement('div');
    token.className='token';token.id='playerToken';token.textContent='⚔️';
    board.appendChild(token);
}

function getTileEl(idx){ return document.getElementById('tile'+idx); }

function positionToken(idx, animate){
    const tile=getTileEl(idx);
    const token=document.getElementById('playerToken');
    if(!tile||!token) return;
    const br=tile.getBoundingClientRect();
    const boardR=document.getElementById('board').getBoundingClientRect();
    token.style.left=(br.left-boardR.left+32)+'px';
    token.style.top=(br.top-boardR.top+27)+'px';
}

async function rollDice(){
    if(rolling) return;
    if(myCoins<COST){alert('Not enough coins!');return;}
    rolling=true;
    const btn=document.getElementById('rollBtn');
    btn.disabled=true; btn.textContent='ROLLING···';

    try{
        const r=await fetch('https://api.ddon.org/api/festival/arcade/bet',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:COST})});
        const d=await r.json();
        if(!d.success){alert('Not enough coins!');btn.disabled=false;btn.textContent='🎲 ROLL — 10 COINS';rolling=false;return;}
        myCoins=d.coinsLeft;document.getElementById('coinCount').textContent=myCoins;
    }catch(_){btn.disabled=false;btn.textContent='🎲 ROLL — 10 COINS';rolling=false;return;}

    // Animate dice
    const diceEl=document.getElementById('diceDisplay');
    const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
    let count=0;
    const rollAnim=setInterval(()=>{
        diceEl.textContent=faces[Math.floor(Math.random()*6)];
        diceEl.classList.add('dice-rolling');
        count++;
        if(count>10) clearInterval(rollAnim);
    },80);

    const roll=Math.floor(Math.random()*6)+1;
    setTimeout(async()=>{
        diceEl.textContent=faces[roll-1];
        addLog(`Rolled a ${roll}!`);

        // Move token step by step
        for(let i=0;i<roll;i++){
            position=(position+1)%BOARD_TILES.length;
            // Highlight current tile
            document.querySelectorAll('.tile').forEach(t=>t.classList.remove('current','active'));
            const tile=getTileEl(position);
            if(tile) tile.classList.add('current');
            positionToken(position,true);
            await sleep(350);
        }

        document.getElementById('posVal').textContent=position+' / '+(BOARD_TILES.length-1);
        document.getElementById('roundVal').textContent=parseInt(document.getElementById('roundVal').textContent)+1;

        await handleTile(BOARD_TILES[position]);

        rolling=false;
        btn.disabled=false;
        btn.textContent='🎲 ROLL — 10 COINS';
    },900);
}

async function handleTile(tile){
    const status=document.getElementById('statusMsg');
    if(tile.type==='start'){
        addLog('Back to START! Full lap bonus: +5 🪙','good');
        await payout(5);
        status.textContent='Full lap! Bonus coins earned.';
    } else if(tile.type==='coin'){
        const c=tile.coins;
        if(c>0){
            addLog(`${tile.name} → +${c} coins`,'good');
            await payout(c);
            status.textContent=`Gained ${c} coins!`;
        } else {
            addLog(`${tile.name} → ${c} coins`,'bad');
            await deductCoins(Math.abs(c));
            status.textContent=`Lost ${Math.abs(c)} coins!`;
        }
    } else if(tile.type==='item'){
        const item=randItem(tile.rarity||'common');
        const label='Mystery Item';
        addLog(`${label}: ${item.name}!`,'item');
        boardMeta.gotItem=true;
        status.textContent=`Won: ${item.name}! Sending to Itempost...`;
        await deliverItem(item);
    } else if(tile.type==='jackpot'){
        addLog('⭐ JACKPOT! +30 coins!','jackpot');
        boardMeta.jackpot=true;
        await payout(30);
        status.textContent='JACKPOT! 30 coins earned!';
    } else if(tile.type==='bonus'){
        addLog('Extra Roll granted!','good');
        status.textContent='Extra roll! Roll again for free!';
        // Give a free roll by refunding cost
        await payout(COST);
    } else if(tile.type==='boss'){
        addLog(`${tile.name}`,'bad');
        await deductCoins(Math.abs(tile.coins));
        status.textContent=`A monster attacked! Lost ${Math.abs(tile.coins)} coins!`;
    } else if(tile.type==='curse'){
        addLog(`Cursed! -${Math.abs(tile.coins)} coins`,'bad');
        await deductCoins(Math.abs(tile.coins));
        status.textContent='Cursed by the Rift!';
    }
}

let boardMeta={jackpot:false,gotItem:false};

async function payout(amount){
    try{
        const r=await fetch('https://api.ddon.org/api/festival/arcade/payout',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,game:'board',meta:boardMeta})});
        const d=await r.json();
        if(d.success){myCoins=d.coinsLeft;document.getElementById('coinCount').textContent=myCoins;showAchPopups(d.newAchievements||[]);}
    }catch(_){}
}

async function deductCoins(amount){
    const actual=Math.min(amount,myCoins);
    if(actual<=0) return;
    try{
        await fetch('https://api.ddon.org/api/festival/arcade/bet',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:actual})});
        myCoins=Math.max(0,myCoins-actual);
        document.getElementById('coinCount').textContent=myCoins;
    }catch(_){}
}

async function deliverItem(item){
    if(!selectedChar){ await pickChar(item); return; }
    await sendItem(item,selectedChar);
}

function pickChar(item){
    return new Promise(resolve=>{
        const list=document.getElementById('charPickerList');
        list.innerHTML='';
        myChars.forEach(c=>{
            const row=document.createElement('div');
            row.className='char-pick-row';
            row.textContent=c.name;
            row.onclick=async()=>{
                selectedChar=c.id;
                document.getElementById('charPickerModal').style.display='none';
                await sendItem(item,c.id);
                resolve();
            };
            list.appendChild(row);
        });
        document.getElementById('charPickerModal').style.display='flex';
    });
}

async function sendItem(item,charId){
    try{
        await fetch('https://api.ddon.org/api/festival/arcade/board/reward',{
            method:'POST',credentials:'include',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({itemId:item.itemId,qty:1,characterId:charId})
        });
        document.getElementById('statusMsg').textContent=`${item.name} sent to Itempost! ✓`;
    }catch(_){}
}

function addLog(text,type=''){
    const log=document.getElementById('log');
    const entry=document.createElement('div');
    entry.className='log-entry'+(type?' '+type:'');
    entry.textContent=text;
    log.prepend(entry);
    if(log.children.length>20) log.lastChild.remove();
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }



const ACH_NAMES={goblin_first:'Goblin Smasher',goblin_10:'Whack Master',goblin_20:'Goblin Destroyer',
memory_first:'Sharp Mind',memory_fast:'Rift Scholar',roulette_first:'Duelist',roulette_streak:'Unstoppable Arisen',
board_first:'Rolling Start',board_jackpot:"Fortune's Favorite",board_item:'Rift Collector',
arcade_all:'Festival Champion',first_coin:'Coin Collector',coins_100:'Festival Regular',
coins_500:'Festival Veteran',coins_1000:'Festival Legend'};
const ACH_ICONS={goblin_first:'🪓',goblin_10:'💥',goblin_20:'👺',memory_first:'🃏',memory_fast:'⚡',
roulette_first:'⚔️',roulette_streak:'🔥',board_first:'🎲',board_jackpot:'⭐',board_item:'🎁',
arcade_all:'🎮',first_coin:'🪙',coins_100:'💰',coins_500:'💎',coins_1000:'👑'};

function showAchPopups(ids){
    (ids||[]).forEach((id,i)=>{
        setTimeout(()=>{
            const el=document.createElement('div');
            el.className='ach-notif';
            el.innerHTML='<div class="ach-notif-icon">'+(ACH_ICONS[id]||'🏆')+'</div><div class="ach-notif-eye">ACHIEVEMENT UNLOCKED</div><div class="ach-notif-name">'+(ACH_NAMES[id]||id)+'</div>';
            document.getElementById('achNotifContainer').appendChild(el);
            el.addEventListener('animationend',()=>el.remove());
        },i*600);
    });
}

init();

// Language selector init
if(window.buildLangSelector){
    document.getElementById('langSelectorWrap').innerHTML=window.buildLangSelector();
}
window.addEventListener('langchange',()=>{ location.reload(); });

</script>

<style>
#achNotifContainer{position:fixed;top:80px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.ach-notif{background:linear-gradient(135deg,#181a30,#101222);border:1px solid #c8a75d;padding:12px 18px;min-width:240px;animation:achSlide 4s ease forwards;}
@keyframes achSlide{0%{opacity:0;transform:translateX(40px);}10%{opacity:1;transform:translateX(0);}80%{opacity:1;}100%{opacity:0;}}
.ach-notif-eye{font-size:9px;letter-spacing:3px;color:#c8a75d;opacity:.6;margin-bottom:4px;}
.ach-notif-name{font-size:13px;color:#fff;letter-spacing:1px;}
.ach-notif-icon{font-size:20px;margin-bottom:4px;}
</style>
<div id="achNotifContainer"></div>

</body>
</html>
